[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memex-research"
version = "0.1.0"
description = "Experimental classifier and probe work for the Memex project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4.2,<2.0.0",
  "numpy>=1.26.0,<3.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "scikit-learn>=1.5.0,<2.0.0",
  "sentencepiece>=0.2.0,<1.0.0",
  "torch>=2.4.0,<3.0.0",
  "transformers>=4.48.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0,<2.0.0",
  "pytest>=8.2.0,<9.0.0",
  "ruff>=0.9.0,<1.0.0",
]
research = [
  "accelerate>=0.26.0,<2.0.0",
  "datasets>=3.0.0,<4.0.0",
  "protobuf>=5.28.0,<8.0.0",
  "sae-lens>=6.28.1,<7.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E712"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
files = ["src/memex_research"]
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_configs = true
